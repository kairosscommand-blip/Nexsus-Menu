# NexusMenu configuration -- entirely config-driven. Every button below dispatches the exact
# command a player would type themselves (Bukkit.dispatchCommand), so a permission-gated command
# just fails the same "no permission" way it would if typed -- there is no separate logic to keep
# in sync with any other plugin, and a plugin that isn't installed/enabled simply doesn't show a
# category (checked live via installed_check, not just at startup).

menu-item:
  # A plain vanilla ENCHANTED_BOOK, PDC-tagged -- not a WRITTEN_BOOK. NexusStarter's own guide
  # item deliberately avoids relying on the client-side book-reading gesture for exactly this
  # reason (see its GuideItemFactory/GuideBookFactory doc comments): the trigger has to be a
  # plain right-click on an ordinary item so it behaves identically on Java and Bedrock/Xbox
  # (via Geyser). This item never opens as a real book -- right-clicking it just opens the GUI.
  material: ENCHANTED_BOOK
  display-name: "&d&lNexus Codex"
  lore:
    - "&7Right-click to open the Nexus Hub --"
    - "&7every shop, realm, house, and system"
    - "&7on the server, in one menu."
    - "&8This item is bound to you -- it cannot"
    - "&8be dropped, traded away, or lost."
  # true (default): the Codex can't be dropped (Q/Ctrl+Q), can't be moved into any other
  # inventory/container/crafting grid/anvil, and is frozen in place whenever another inventory
  # is open at all. See MenuItemLockListener.
  lock-in-inventory: true
  # true (default): the Codex is stripped from death drops (so it can never be lost or duped on
  # the ground) and silently replaced the moment the player respawns.
  keep-on-death: true

first-join:
  give-item: true
  delay-seconds: 3
  chat-message: "&b&lYou've received a Nexus Codex! &7Right-click it, or type &f/menu&7, any time."

titles:
  root: "&5&lNexus Hub"
  category-prefix: "&5&l"  # prepended to a category's own title for its submenu's inventory title

categories:
- id: nexushouses
  plugin: NexusHouses
  installed_check: NexusHouses
  title: Great Houses
  icon: SHIELD
  description: Found, manage, and interact with Great Houses -- sigils, succession, fealty, alliances,
    rivalries, and a real treasury.
  entries:
  - label: My House Info
    type: COMMAND
    icon: BOOK
    lore:
    - Shows your own house's sigil, head, heir, treasury, allies and rivals.
    command: house info
  - label: List Great Houses
    type: COMMAND
    icon: MAP
    lore:
    - Lists every founded house and its sworn bannermen.
    command: house list
  - label: Found a House
    type: TEXT
    icon: BANNER_PATTERN
    lore:
    - 'Usage: /house create <name> <sigilBeast> <primaryColor> <secondaryColor> [motto...]'
    - Needs a chained sequence of up to 5 text prompts -- the most complex multi-step flow in this manifest.
    command_prefix: house create
    prompts:
    - title: House name
      optional: false
    - title: Sigil beast (e.g. WOLF, LION)
      optional: false
    - title: Primary color
      optional: false
    - title: Secondary color
      optional: false
    - title: Motto (optional, can be left blank)
      optional: true
  - label: Disband My House
    type: COMMAND
    icon: TNT
    lore:
    - Dissolves your own house. Only the head of house can do this (checked in HouseEngine, not by args).
    command: house disband
  - label: Abdicate
    type: COMMAND
    icon: IRON_SWORD
    lore:
    - Step down as head of your house (heir takes over, if set).
    command: house abdicate
  - label: Invite Player
    type: PLAYER
    icon: PLAYER_HEAD
    lore:
    - Invites an online player to join your house. Target must be online.
    command_prefix: house invite
  - label: Join a House
    type: TEXT
    icon: OAK_DOOR
    lore:
    - Accepts a pending invite from the named house.
    - Enumerate existing houses via 'house list'.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house join
    prompts:
    - title: Value
      optional: false
  - label: Kick Member
    type: PLAYER
    icon: BARRIER
    lore:
    - Removes the named player from your own house.
    - Target should already be one of your house's members (not validated by the executor itself -- HouseEngine
      enforces it).
    command_prefix: house kick
  - label: Leave House
    type: COMMAND
    icon: OAK_DOOR
    lore:
    - Leaves your current house.
    command: house leave
  - label: Set Heir
    type: PLAYER
    icon: GOLDEN_HELMET
    lore:
    - Target must be an online player; should already be a member of your house (enforced in HouseEngine).
    command_prefix: house setheir
  - label: Claim Banner
    type: COMMAND
    icon: WHITE_BANNER
    lore:
    - Gives you a physical banner item for your house (sneak-right-click a tamed horse with it to swear
      it in).
    command: house banner
  - label: Swear Fealty
    type: TEXT
    icon: IRON_CHESTPLATE
    lore:
    - Offers your house's fealty to the named liege house.
    - Enumerate via 'house list'.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house swear
    prompts:
    - title: Value
      optional: false
  - label: Accept Vassal
    type: TEXT
    icon: SHIELD
    lore:
    - Accepts the named house's offer of fealty to yours.
    - Enumerate via 'house list'.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house acceptvassal
    prompts:
    - title: Value
      optional: false
  - label: Break Fealty
    type: COMMAND
    icon: SHEARS
    lore:
    - Breaks your house's own oath of fealty to its liege.
    command: house breakfealty
  - label: Propose Alliance
    type: TEXT
    icon: GOLDEN_APPLE
    lore:
    - Proposes (or confirms) an alliance with the named house.
    - Enumerate via 'house list'.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house ally
    prompts:
    - title: Value
      optional: false
  - label: Accept Alliance
    type: TEXT
    icon: GOLDEN_APPLE
    lore:
    - Accepts a pending alliance proposal from the named house.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house acceptally
    prompts:
    - title: Value
      optional: false
  - label: Break Alliance
    type: TEXT
    icon: SHEARS
    lore:
    - Ends the alliance with the named house.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house breakally
    prompts:
    - title: Value
      optional: false
  - label: Declare Rival
    type: TEXT
    icon: RED_BANNER
    lore:
    - Declares the named house your rival.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house rival
    prompts:
    - title: Value
      optional: false
  - label: Offer Peace
    type: TEXT
    icon: WHITE_BANNER
    lore:
    - Offers/makes peace with the named rival house.
    - Type the exact house name (see 'List Great Houses' first).
    command_prefix: house peace
    prompts:
    - title: Value
      optional: false
  - label: Donate to Treasury
    type: TEXT
    icon: GOLD_INGOT
    lore:
    - Donates real Vault money from you into your own house's treasury.
    - Requires Vault + a Vault-compatible economy plugin to be installed.
    command_prefix: house donate
    prompts:
    - title: Amount to donate (number)
      optional: false
- id: nexuseconomy
  plugin: NexusEconomy
  installed_check: NexusEconomy
  title: Economy
  icon: EMERALD
  description: Bank/pay, the item shop and quick-sell, a bounty order board, an auction house, a credit
    account/card, and a stock market. NexusEconomy registers 11 separate root commands (bank, shop, sell,
    orders, auction, credit, stocks, tpa, tpaccept, tpdeny, tpacancel), not just one -- every entry below
    lists its own full command string.
  entries:
  - label: Open the Shop
    type: COMMAND
    icon: EMERALD
    lore:
    - Opens the real category shop GUI (buy/sell, all vanilla items + integration tabs).
    command: shop
  - label: Sell Item In Hand
    type: COMMAND
    icon: GOLD_NUGGET
    lore:
    - Sells the stack currently in your main hand at shop sell price.
    command: sell hand
  - label: Sell All Sellable Items
    type: COMMAND
    icon: CHEST
    lore:
    - Sells everything in your inventory the shop will buy back.
    command: sell all
  - label: Open Bank Menu
    type: COMMAND
    icon: GOLD_INGOT
    lore:
    - Opens the bank GUI (no args).
    command: bank
  - label: Check Balance
    type: COMMAND
    icon: PAPER
    lore:
    - Shows your current bank balance.
    command: bank balance
  - label: Pay a Player
    type: PLAYER_TEXT
    icon: SUNFLOWER
    lore:
    - Pick a player, then enter an amount to pay them.
    command_prefix: bank pay
    prompts:
    - title: Amount
      optional: false
  - label: Withdraw Cash
    type: TEXT
    icon: PAPER
    lore:
    - Withdraws physical cash bills from your bank balance (whole dollars only).
    command_prefix: bank withdraw
    prompts:
    - title: Amount
      optional: false
  - label: Deposit Cash
    type: COMMAND
    icon: HOPPER
    lore:
    - Deposits all physical cash you're carrying into your bank balance.
    command: bank deposit
  - label: Order Board
    type: COMMAND
    icon: OAK_SIGN
    lore:
    - Lists all active bounty orders and short IDs.
    command: orders list
  - label: Post a Bounty Order
    type: TEXT
    icon: DIAMOND
    lore:
    - Post an order for other players to fulfill.
    command_prefix: orders create
    prompts:
    - title: Material
      optional: false
    - title: Quantity
      optional: false
    - title: Pay per item
      optional: false
  - label: Fulfill an Order
    type: TEXT
    icon: HOPPER
    lore:
    - Turn in items against someone else's posted order (must be holding the item).
    command_prefix: orders fulfill
    prompts:
    - title: Id
      optional: false
  - label: Cancel My Order
    type: TEXT
    icon: BARRIER
    lore:
    - Cancels and refunds an order you posted.
    command_prefix: orders cancel
    prompts:
    - title: Id
      optional: false
  - label: Auction House
    type: COMMAND
    icon: GOLD_BLOCK
    lore:
    - Lists all active auction listings.
    command: auction list
  - label: List Item in Hand for Auction
    type: TEXT
    icon: ITEM_FRAME
    lore:
    - Lists the item currently in your hand.
    command_prefix: auction sell
    prompts:
    - title: Starting price
      optional: false
    - title: Duration minutes
      optional: false
  - label: Bid on an Auction
    type: TEXT
    icon: GOLD_NUGGET
    lore:
    - Bid on an active listing.
    command_prefix: auction bid
    prompts:
    - title: Id
      optional: false
    - title: Amount
      optional: false
  - label: Claim Auction Winnings
    type: COMMAND
    icon: ENDER_CHEST
    lore:
    - Collects items you've won or unsold items returned to you.
    command: auction claim
  - label: Credit Account Status
    type: COMMAND
    icon: PAPER
    lore:
    - Shows balance owed, credit limit, minimum due, and credit score.
    command: credit status
  - label: Take a Cash Advance
    type: TEXT
    icon: MAGMA_CREAM
    lore:
    - Charges an amount to your credit account, deposited straight into your bank.
    command_prefix: credit charge
    prompts:
    - title: Amount
      optional: false
  - label: Make a Credit Payment
    type: TEXT
    icon: EMERALD
    lore:
    - Pays down your credit balance from your bank.
    command_prefix: credit pay
    prompts:
    - title: Amount
      optional: false
  - label: Pay Off Full Balance
    type: COMMAND
    icon: NETHERITE_INGOT
    lore:
    - Pays your entire outstanding credit balance in one go, if you can afford it.
    command: credit payoff
  - label: Pay a NexusBudget Bill
    type: TEXT
    icon: PAPER
    lore:
    - Pays a NexusBudget bill directly with your credit card.
    command_prefix: credit paybill
    prompts:
    - title: BillId
      optional: false
    - title: Amount
      optional: false
  - label: Get a Credit Card
    type: COMMAND
    icon: IRON_INGOT
    lore:
    - Issues yourself a physical credit card item (no player argument -- with an argument it's an admin-only
      re-issue to someone else).
    command: credit give
  - label: Stock Market
    type: COMMAND
    icon: PAPER
    lore:
    - Lists every stock, current price, and trend arrow.
    command: stocks list
  - label: Check a Stock Price
    type: TEXT
    icon: MAP
    lore:
    - Looks up a single stock's current price.
    command_prefix: stocks price
    prompts:
    - title: Symbol
      optional: false
  - label: Buy Shares
    type: TEXT
    icon: LIME_DYE
    lore:
    - Buys shares of a stock against your bank balance.
    command_prefix: stocks buy
    prompts:
    - title: Symbol
      optional: false
    - title: Shares
      optional: false
  - label: Sell Shares
    type: TEXT
    icon: RED_DYE
    lore:
    - Sells shares you own.
    command_prefix: stocks sell
    prompts:
    - title: Symbol
      optional: false
    - title: Shares
      optional: false
  - label: My Portfolio
    type: COMMAND
    icon: CHEST_MINECART
    lore:
    - Shows every stock you hold, average cost, and current value.
    command: stocks portfolio
  - label: Request Teleport to a Player
    type: PLAYER
    icon: ENDER_PEARL
    lore:
    - Sends a teleport request (costs money unless you have the bypass permission).
    command_prefix: tpa
  - label: Accept Teleport Request
    type: COMMAND
    icon: LIME_WOOL
    lore:
    - Accepts the teleport request currently pending against you.
    command: tpaccept
  - label: Deny Teleport Request
    type: COMMAND
    icon: RED_WOOL
    lore:
    - Denies the teleport request currently pending against you.
    command: tpdeny
  - label: Cancel My Teleport Request
    type: COMMAND
    icon: BARRIER
    lore:
    - Cancels the outgoing teleport request you sent.
    command: tpacancel
- id: nexusrealms
  plugin: NexusRealms
  installed_check: NexusRealms
  title: Realms & Territory
  icon: GRASS_BLOCK
  description: Team (country) territory claims with rank hierarchy, nested personal claims, named homes,
    and a from-scratch WorldEdit-style region editor.
  entries:
  - label: Create Team
    type: TEXT
    icon: WHITE_BANNER
    lore:
    - Founds a new team with you as leader.
    command_prefix: team create
    prompts:
    - title: Team (country) name
      optional: false
  - label: Invite to Team
    type: PLAYER
    icon: PLAYER_HEAD
    lore:
    - Directly adds the target as a member (no accept step) -- requires you to be officer+ in your own
      team.
    command_prefix: team invite
  - label: Kick from Team
    type: PLAYER
    icon: BARRIER
    lore:
    - Requires officer+; can't kick the leader; only the leader can kick a fellow officer.
    command_prefix: team kick
  - label: Leave Team
    type: COMMAND
    icon: OAK_DOOR
    lore:
    - Leader can't leave directly -- must /team transfer first.
    command: team leave
  - label: Disband Team
    type: COMMAND
    icon: TNT
    lore:
    - Leader only. Unclaims all of the team's land.
    command: team disband
  - label: My Team Info
    type: COMMAND
    icon: BOOK
    lore:
    - Shows your own team's leader, member count, and outsider-access settings.
    command: team info
  - label: Promote Member
    type: PLAYER
    icon: GOLDEN_HELMET
    lore:
    - Leader only -- promotes a member to officer.
    command_prefix: team promote
  - label: Demote Officer
    type: PLAYER
    icon: IRON_HELMET
    lore:
    - Leader only -- demotes an officer to member.
    command_prefix: team demote
  - label: Transfer Leadership
    type: PLAYER
    icon: GOLDEN_HELMET
    lore:
    - Leader only -- hands leadership to an existing team member; you become an officer.
    command_prefix: team transfer
  - label: 'Team Doors: ON'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'doors' outsider-access setting to ON. Requires officer+.
    command: team settings doors on
  - label: 'Team Doors: OFF'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'doors' outsider-access setting to OFF. Requires officer+.
    command: team settings doors off
  - label: 'Team Containers: ON'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'containers' outsider-access setting to ON. Requires officer+.
    command: team settings containers on
  - label: 'Team Containers: OFF'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'containers' outsider-access setting to OFF. Requires officer+.
    command: team settings containers off
  - label: 'Team PvP: ON'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'pvp' outsider-access setting to ON. Requires officer+.
    command: team settings pvp on
  - label: 'Team PvP: OFF'
    type: COMMAND
    icon: LEVER
    lore:
    - Sets your team's 'pvp' outsider-access setting to OFF. Requires officer+.
    command: team settings pvp off
  - label: Claim This Chunk
    type: COMMAND
    icon: GRASS_BLOCK
    lore:
    - Claims the chunk you're standing in for your team. Requires officer+ and available chunk cap.
    command: realms claim
  - label: Claim Chunks by Radius
    type: TEXT
    icon: GRASS_BLOCK
    lore:
    - Bulk-claims a square of chunks centered on you, capped by config and your team's remaining chunk
      cap.
    command_prefix: realms claim radius
    prompts:
    - title: Radius in chunks
      optional: false
  - label: Unclaim This Chunk
    type: COMMAND
    icon: DIRT
    lore:
    - Unclaims the chunk you're standing in.
    command: realms unclaim
  - label: Unclaim All Land
    type: COMMAND
    icon: TNT
    lore:
    - Unclaims every chunk belonging to your team.
    command: realms unclaim all
  - label: Land Info Here
    type: COMMAND
    icon: MAP
    lore:
    - Shows which team (if any) owns the chunk you're standing in.
    command: realms info
  - label: Chunk Cap Tiers
    type: COMMAND
    icon: EMERALD
    lore:
    - Lists chunk-cap upgrade tiers and prices for your team.
    command: realms tiers
  - label: Upgrade Chunk Cap
    type: TEXT
    icon: EMERALD_BLOCK
    lore:
    - Requires officer+ and enough Vault money; costs real currency per 'realms tiers'.
    command_prefix: realms upgrade
    prompts:
    - title: Target chunk cap (see tiers first)
      optional: false
  - label: Create Personal Claim
    type: TEXT
    icon: OAK_FENCE
    lore:
    - Stakes a small claim inside your team's territory. Must be standing entirely inside your own team's
      land.
    command_prefix: pclaim create
    prompts:
    - title: Label for this claim (optional, can be left blank)
      optional: false
  - label: Remove Personal Claim
    type: COMMAND
    icon: BARRIER
    lore:
    - Removes the personal claim you're currently standing in (must be yours).
    command: pclaim remove
  - label: My Personal Claims
    type: COMMAND
    icon: MAP
    lore:
    - Lists all of your own personal claims with location and radius.
    command: pclaim list
  - label: Trust in Claim (Visitor)
    type: PLAYER
    icon: IRON_DOOR
    lore:
    - Grants visitor permission in the personal claim you're standing in and own.
    command_prefix: pclaim trust
    command_suffix: visitor
  - label: Trust in Claim (Builder)
    type: PLAYER
    icon: IRON_DOOR
    lore:
    - Grants builder permission in the personal claim you're standing in and own.
    command_prefix: pclaim trust
    command_suffix: builder
  - label: Untrust in Personal Claim
    type: PLAYER
    icon: BARRIER
    lore:
    - Acts on whichever personal claim you're standing in and own.
    command_prefix: pclaim untrust
  - label: Set Home (default)
    type: COMMAND
    icon: RED_BED
    lore:
    - Sets your default home at your current location.
    - 'Also supports a named variant: /sethome <name> (needs_text) if you want multiple homes, up to your
      cap.'
    command: sethome
  - label: Set Named Home
    type: TEXT
    icon: RED_BED
    lore:
    - Sets a named home at your current location (subject to your homes.max cap).
    command_prefix: sethome
    prompts:
    - title: Home name
      optional: false
  - label: Teleport Home (default)
    type: COMMAND
    icon: ENDER_PEARL
    lore:
    - Teleports to your default ("home") home.
    command: home
  - label: Teleport to Named Home
    type: TEXT
    icon: ENDER_PEARL
    lore:
    - Ideally enumerated via 'homes' rather than typed blind, since it's a closed list of the player's
      own homes -- no player-picker applies here (it's a home name, not a player name).
    command_prefix: home
    prompts:
    - title: Home name (see "My Homes" list first)
      optional: false
  - label: Delete Home
    type: TEXT
    icon: LAVA_BUCKET
    lore:
    - See 'homes' first for valid names.
    command_prefix: delhome
    prompts:
    - title: Home name to delete (blank = default "home")
      optional: false
  - label: My Homes
    type: COMMAND
    icon: BOOKSHELF
    lore:
    - Lists every home you've set, with coordinates, and your cap.
    command: homes
  - label: Get Region Wand
    type: COMMAND
    icon: GOLDEN_AXE
    lore:
    - 'Gives the /redit selection wand item. Requires nexusrealms.worldedit.use (default: true) -- players
      can use /redit only inside their own personal claims (admins anywhere).'
    command: redit wand
  - label: Set Position 1
    type: COMMAND
    icon: YELLOW_WOOL
    lore:
    - Sets selection corner 1 to your current location.
    command: redit pos1
  - label: Set Position 2
    type: COMMAND
    icon: ORANGE_WOOL
    lore:
    - Sets selection corner 2 to your current location.
    command: redit pos2
  - label: Fill Selection
    type: TEXT
    icon: STONE
    lore:
    - Fills your current selection with the named material. Selection must be inside your own claim.
    command_prefix: redit set
    prompts:
    - title: Material name (e.g. STONE)
      optional: false
  - label: Replace in Selection
    type: TEXT
    icon: COBBLESTONE
    lore:
    - 'Needs two pieces of text in order: the material being replaced, then its replacement.'
    command_prefix: redit replace
    prompts:
    - title: Material to replace FROM
      optional: false
    - title: Material to replace TO
      optional: false
  - label: Build Walls
    type: TEXT
    icon: BRICKS
    lore:
    - Builds walls around your selection out of the named material.
    command_prefix: redit walls
    prompts:
    - title: Material name
      optional: false
  - label: Outline Selection
    type: TEXT
    icon: IRON_BARS
    lore:
    - Outlines the edges of your selection with the named material.
    command_prefix: redit outline
    prompts:
    - title: Material name
      optional: false
  - label: Copy Selection
    type: COMMAND
    icon: PAPER
    lore:
    - Copies your current selection to your personal clipboard.
    command: redit copy
  - label: Paste Clipboard
    type: COMMAND
    icon: WRITTEN_BOOK
    lore:
    - Pastes your clipboard at your current location (must land entirely inside your own claim).
    command: redit paste
  - label: Undo Last Edit
    type: COMMAND
    icon: RED_DYE
    lore:
    - Reverts your most recent /redit operation.
    command: redit undo
- id: nexussurvival
  plugin: NexusSurvival
  installed_check: NexusSurvival
  title: Survival
  icon: POTION
  description: 'Thirst, radiation, hygiene, and disease systems. IMPORTANT: the entire /nexussurvival
    command (give, radiation, status, resetme, removeall, plaguedeaths, cureplayer, reload) is gated in
    plugin.yml by permission ''nexussurvival.admin'' (default: op) at the Bukkit command-dispatch level
    -- a regular non-op player cannot run ANY of those subcommands, whether typed or via Bukkit.dispatchCommand,
    because PluginCommand#execute rejects it before onCommand ever runs. The only player-facing command
    this plugin registers is the separate root command ''/spawn'' (aliases worldspawn, wspawn), which
    has no permission node.'
  entries:
  - label: Go to World Spawn
    type: COMMAND
    icon: ENDER_PEARL
    lore:
    - Teleport to the server's fixed world spawn point.
    command: spawn
  - label: How Do I Cure a Disease?
    type: INFO
    icon: MILK_BUCKET
    lore:
    - There is no self-service cure command -- curing is done by DRINKING a matching
    - cure potion. Get one by crafting it (see the recipe book) or buying it from
    - NexusEconomy's shop, under the Disease tab. Open the Shop from its own tab
    - in this menu, then look for Disease items.
- id: nexuswarfare
  plugin: NexusWarfare
  installed_check: NexusWarfare
